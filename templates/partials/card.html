{% macro card(post) %}
<div class="border-t border-border-soft p-5">
    <p class="text-date text-[11px] font-['JetBrains_Mono',monospace] mb-1.5">{{ post.created_at | local_timezone }}</p>
    <h3 class="text-[22px] text-ink font-['Times_New_Roman',serif] mb-2">{{ post.title }}</h3>
    <p class="text-[14px] text-ink-muted leading-[1.6] mb-2">{{ post.body | truncate(50) }}...</p>
    <a href="/post/{{post.id}}" class="text-accent text-[13px]">Read more →</a>
</div>
{% endmacro %}

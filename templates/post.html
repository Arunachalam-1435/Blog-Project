{% extends "base.html" %}
{% block title %}{{post_content.title}}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl p-8">
    <h1 class="text-ink text-5xl font-serif mb-3">{{post_content.title}}</h1>
    <i class="text-date block mb-4">created_at: {{post_content.created_at | local_timezone}}</i>
    <br>
    <article class="prose prose-headings:m-2 prose-p:m-2 prose-li:m-2 prose-ol:m-2 
    prose-hr:my-4 prose-pre:m-2 no-backticks">
        {{post_content.body | markdown | safe}}
    </article>
</div>
{% endblock %}
